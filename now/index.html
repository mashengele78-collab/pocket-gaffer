<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gaffer" />
  <title>Pocket Gaffer</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../icons/icon-192.png" />
  <style>
    :root{--bg:#0b0e0d;--fg:#e7eee8;--mute:#8b968f;--line:#1b2320;--card:#121715;--acc:#c8d7c5;--pitch:#1a3a2c}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
    body{padding:calc(12px + env(safe-area-inset-top)) 16px 28px}
    button,select{font:inherit} h1,h2,h3{margin:0;letter-spacing:-.03em}
    h1{font-size:40px;margin-top:8px}
    .wrap{max-width:640px;margin:0 auto}
    .bar{display:flex;justify-content:space-between;color:var(--mute);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px}
    .hero{text-align:center;padding:18px 0 8px}
    .k{color:var(--mute);letter-spacing:.16em;text-transform:uppercase;font-size:11px}
    .lead{color:#b6c0ba;line-height:1.45;margin:10px auto 18px;max-width:26rem}
    .lead.left{text-align:left}
    .col{display:flex;flex-direction:column;gap:10px}
    .col.list,.col.gap{margin-top:12px}
    .btn{border:0;border-radius:14px;padding:14px 16px;background:#1a211e;color:var(--fg);width:100%;text-align:center;cursor:pointer}
    .btn.on{background:var(--acc);color:#111}
    .btn.ghost{background:transparent;color:var(--mute);width:auto;padding:8px 0}
    .btn.half{width:48%}
    .btn:disabled{opacity:.35}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
    .card.pad{margin:12px 0}
    .card.later,.out{margin-top:8px}
    .card.mail{margin-bottom:8px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .tabs{display:flex;gap:6px;overflow:auto;padding:2px 0 10px}
    .tabs .btn{width:auto;padding:8px 12px;border-radius:999px;background:#151b19;color:var(--mute)}
    .tabs .btn.on{background:var(--acc);color:#111}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:8px 4px;text-align:left;border-bottom:1px solid var(--line)}
    .you{color:var(--acc)}.mute{color:var(--mute)}.s{font-size:12px}
    canvas{width:100%;display:block;background:var(--pitch);border-radius:16px}
    .score{display:flex;justify-content:space-between;align-items:center;margin:8px 0 10px}.score b{font-size:30px}
    .r{text-align:right}
    select{width:100%;background:#151b19;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px}
    .hl{border-left:3px solid var(--acc);padding:6px 0 6px 10px;margin:6px 0;font-size:13px}
    .err{color:#e07a6a;font-size:13px}
    .h,.nx{margin:8px 0 6px}
    .sub,.body{margin-top:6px}
    .play{margin-top:14px}
    .line{margin-top:8px}
    .linebox{min-height:2.6em;margin:10px 0}
    .clips{margin-top:10px}
    #done{margin-top:12px}
  </style>
</head>
<body>
  <div class="wrap" id="root"></div>
  <script src="./app.js"></script>
</body>
</html>
